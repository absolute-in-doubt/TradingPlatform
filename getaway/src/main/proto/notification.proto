syntax = "proto3";

package invest.notification.v1;

option java_multiple_files = true;
option java_package = "invest.notification.v1";

service NotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc CountUnread(CountUnreadRequest) returns (CountUnreadResponse);
  rpc MarkRead(MarkReadRequest) returns (NotificationResponse);
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse);
}

enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  TRADE_EXECUTED = 1;
  PAYMENT_PROCESSED = 2;
  ASSET_PRICE_CHANGE = 3;
  PORTFOLIO_VALUE_CHANGE = 4;
}

enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  SENT = 2;
  FAILED = 3;
}

message NotificationResponse {
  string id = 1;
  string user_id = 2;
  NotificationType type = 3;
  string title = 4;
  string message = 5;
  DeliveryStatus delivery_status = 6;
  bool is_read = 7;
  string created_at = 8;
  string read_at = 9;
}

message ListNotificationsRequest {
  string user_id = 1;
  bool unread_only = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListNotificationsResponse {
  repeated NotificationResponse items = 1;
  int32 total_count = 2;
}

message CountUnreadRequest {
  string user_id = 1;
}

message CountUnreadResponse {
  int32 count = 1;
}

message MarkReadRequest {
  string notification_id = 1;
  string user_id = 2;
}

message MarkAllReadRequest {
  string user_id = 1;
}

message MarkAllReadResponse {
  int32 updated_count = 1;
}
