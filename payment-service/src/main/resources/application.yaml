server:
  port: 8085

spring:
  liquibase:
    enabled: false
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5433/payment_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  grpc:
    server:
      port: 9085
    client:
      channel:
        user-service:
          address: 'static://localhost:9081'
          target: 'static://localhost:9081'
          negotiation-type: plaintext
        portfolio-service:
          address: 'static://localhost:9083'
          target: 'static://localhost:9083'
          negotiation-type: plaintext
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topics:
      payment-processed: payment.payment-processed
