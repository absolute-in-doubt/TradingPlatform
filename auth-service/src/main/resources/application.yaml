server:
  port: 8081

spring:
  liquibase:
    enabled: false
  application:
    name: auth-service
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  grpc:
    server:
      port: 9081

jwt:
  secret: c3VwZXItc2VjcmV0LWtleS1mb3Itand0LXRyYWRpbmctcGxhdGZvcm0tc2VjdXJpdHk=
  expiration-ms: 86400000
