server:
  port: 8086

spring:
  liquibase:
    enabled: false
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5433/analytics_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  grpc:
    server:
      port: 9086
    client:
      channel:
        portfolio-service:
          address: 'static://localhost:9083'
          target: 'static://localhost:9083'
          negotiation-type: plaintext
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-group-v2
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  kafka:
    topics:
      trade-executed: trading.trade-executed
      payment-processed: payment.payment-processed
      asset-price-updated: asset.price-updated
      portfolio-value-changed: portfolio.value-changed
