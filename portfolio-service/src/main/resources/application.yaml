server:
  port: 8083

spring:
  liquibase:
    enabled: false
  application:
    name: portfolio-service
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5433/portfolio_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  grpc:
    server:
      port: 9083
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: portfolio-group-v2
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  thresholds:
    portfolio-publish-percent: 1.0
  kafka:
    topics:
      portfolio-value-changed: portfolio.value-changed
      trade-executed: trading.trade-executed
      payment-processed: payment.payment-processed
      asset-price-updated: asset.price-updated
